name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # setup-uv 沒有大版本的 tag，固定到 commit；uv 的版本跟 Dockerfile 一樣
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.18"
          cache-python: true
      - run: uv sync --locked
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: uv run pre-commit run --all-files --show-diff-on-failure

  test:
    name: pytest (${{ matrix.db }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite, mysql, mariadb, postgres]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.11.18"
          cache-python: true
      - run: uv sync --locked
      - name: Start ${{ matrix.db }}
        if: matrix.db != 'sqlite'
        run: docker compose -f compose.dev.yaml --profile db up -d --wait ${{ matrix.db }}
      - run: uv run pytest --db ${{ matrix.db }}

  docker:
    name: Docker image
    needs: [lint, test]
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
